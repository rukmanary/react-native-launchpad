appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 60000
- tapOn:
    id: 'tab-component'
- assertVisible:
    id: 'component-title'
- tapOn:
    id: 'tab-api'
- assertVisible:
    id: 'api-title'
- tapOn:
    id: 'tab-profile'
- assertVisible:
    id: 'profile-title'
- tapOn:
    id: 'tab-home'
- assertVisible:
    id: 'home-title'
- tapOn: 'Contoh formulir'
- tapOn:
    id: 'email'
- inputText: 'tester@example.com'
- tapOn:
    id: 'password'
- inputText: 'ExamplePassword123'
- tapOn:
    id: 'submit'
- assertVisible: 'Validation passed'
