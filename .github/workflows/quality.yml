name: Quality
on: [push, pull_request]
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm format:check
      - run: pnpm create-app --name SmokeApp --android-id com.example.smoke --target ../smoke-app --skip-install
      - run: pnpm --dir ../smoke-app install --no-frozen-lockfile
      - run: pnpm --dir ../smoke-app verify
      - run: pnpm --dir ../smoke-app format:check
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      - run: pnpm install --frozen-lockfile
      - run: cd android && ./gradlew assembleDevDebug assembleQaRelease assembleProductionRelease -PreactNativeArchitectures=arm64-v8a
      - run: pnpm native:alignment android/app/build/outputs/apk/production/release/app-production-release-unsigned.apk
      - run: pnpm android:bundle production
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: android/app/build/outputs
